<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimen-04</title>
</head>
<body>
     <fieldset>
        <p><b > <center> <h2>Hotel Room Booking Form </h2></center></b></p>
        <form action="#">
             <center><label for="Name">Full Name:</label>
            <input type="text" name="name" id="name" placeholder="enter your name" required>
            <br>
            <br>
            <label for="Email">Email:</label>
            <input type="text" name="email" id="email" placeholder="enter your email id" required>
            <br>
            <br>
            <label for="Phone">Phone:</label>

            <input type="digits" name="phone" id="phone" placeholder="enter your phone number" required>
            <br><br>
            <label for="Check-in Date">Check-in Date:</label>
               <input type="date" name="checkin" id="checkin" required>
               <br><br> 
               <label for="Check-Out Date">Check-Out Date:</label>
               <input type="date" name="checkout" id="checkout" required>
               <br><br>
               <label for="Room Type">Room Type:</label>
               <select name="Select Room" id="roomtype" required>
                <option value="">Select Room Type</option>
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="Suite">Suite</option>
                <option value="Deluxe">Deluxe</option>
                <option value="Master Badroom">Master Bedroom</option>
                </select>
                <br><br>
                <lable for="number of guests">Number of Guests:</lable>
                <input type="digits" name="digitds" id="digits" placeholder="number of guests" required>
                <br><br>
                <lable for="Special Requests">Special Requests:</lable>
                <br>
               <textarea for="Special Requests" row="5" columns="40">Enter Your Special Requests</textarea>
               <br><br>
               <input type="submit" value="Book now"> <input type="reset" value="Reset">
                  


               
            </center>

        </form>
        
     </fieldset>
</body>
</html>
